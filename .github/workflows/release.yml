name: Build Gomu Release
on:
  push:
    branches: [custom]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRADLE_TASK: assembleStandardRelease
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        run: ./gradlew $GRADLE_TASK --no-daemon
      - name: Tanda tangan APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gomu.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signed
          for apk in $(find app/build/outputs/apk -name '*.apk' | grep -i release); do
            name=$(basename "$apk" .apk | sed 's/-unsigned//')
            "$BT/zipalign" -p -f 4 "$apk" "aligned-$name.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/gomu.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "signed/gomu-$name.apk" "aligned-$name.apk"
          done
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: gomu-release
          path: signed/*.apk
